<!DOCTYPE html>
<html>
<head>
    <title>Week 3 – Interactive DOM Demo</title>
    <style>
        body { font-family: Arial; max-width: 500px; margin: 40px auto; padding: 20px; }
        input { padding: 8px; width: 100%; margin: 6px 0; box-sizing: border-box; }
        button { padding: 10px 20px; background: #4361ee; color: white; border: none; border-radius: 6px; cursor: pointer; }
        #result { margin-top: 15px; padding: 10px; border-radius: 6px; }
        .valid { background: #d1fae5; color: #065f46; }
        .invalid { background: #fee2e2; color: #991b1b; }
    </style>
</head>
<body>
    <h2>Live Form Validation Demo</h2>
    <input type="text" id="username" placeholder="Type a username..." onkeyup="validateLive()">
    <input type="password" id="password" placeholder="Type a password..." onkeyup="validateLive()">
    <div id="result"></div>

    <hr>
    <h2>PHP Server-Side Logic</h2>
    <?php
        $name = "Brian";
        $year = 3;
        echo $year >= 3 ? "<p>$name is a senior student (Year $year)</p>" : "<p>$name is a junior student</p>";
        echo "<ul>";
        for ($i = 1; $i <= 4; $i++) echo "<li>Year $i</li>";
        echo "</ul>";
    ?>

    <script>
        function validateLive() {
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            const result = document.getElementById('result');

            if (u.length === 0 && p.length === 0) {
                result.textContent = '';
                result.className = '';
                return;
            }
            if (u.length < 3) {
                result.textContent = '✕ Username must be at least 3 characters';
                result.className = 'invalid';
            } else if (p.length < 6) {
                result.textContent = '✕ Password must be at least 6 characters';
                result.className = 'invalid';
            } else {
                result.textContent = '✓ Looks good!';
                result.className = 'valid';
            }
        }
    </script>
</body>
</html>
